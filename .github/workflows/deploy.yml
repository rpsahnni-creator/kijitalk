name: Deploy

# After CI passes on master: build images → deploy to staging → smoke test →
# deploy to production. Production uses the "production" GitHub environment,
# so add a required reviewer there (Settings → Environments) to approve each
# release by hand.
#
# Secrets (per environment "staging" and "production"):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY  — server reachable over SSH, with
#     the repo checked out at /opt/kijitalk and deploy/.env filled in
#   WEB_URL, API_URL, AUTH_URL                — public https URLs (smoke tests)
# Repository variables for the browser bundle:
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_AUTH_URL, NEXT_PUBLIC_GOOGLE_CLIENT_ID,
#   NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_POSTHOG_KEY

on:
  workflow_run:
    workflows: [KijiTalk CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      matrix:
        include:
          - { name: api, context: backend }
          - { name: auth, context: auth-service }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kijitalk-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/kijitalk-${{ matrix.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_AUTH_URL=${{ vars.NEXT_PUBLIC_AUTH_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}

  staging:
    needs: build
    # Turn on once the servers exist: Settings → Variables → DEPLOY_ENABLED = true
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/kijitalk && git fetch --quiet && git checkout --quiet ${{ github.event.workflow_run.head_sha || github.sha }}
            export IMAGE_TAG=${{ needs.build.outputs.tag }}
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --remove-orphans
      - name: Smoke test
        run: |
          for url in "${{ secrets.API_URL }}/health" "${{ secrets.AUTH_URL }}/health/" "${{ secrets.WEB_URL }}/"; do
            for i in $(seq 1 20); do curl -fsS "$url" > /dev/null && break; sleep 6; done
            curl -fsS "$url" > /dev/null || { echo "Smoke test failed: $url"; exit 1; }
          done

  production:
    needs: [build, staging]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Back up the database before deploying
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/kijitalk/scripts/backup-db.sh
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/kijitalk && git fetch --quiet && git checkout --quiet ${{ github.event.workflow_run.head_sha || github.sha }}
            export IMAGE_TAG=${{ needs.build.outputs.tag }}
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --remove-orphans
      - name: Smoke test
        run: |
          for url in "${{ secrets.API_URL }}/health" "${{ secrets.AUTH_URL }}/health/" "${{ secrets.WEB_URL }}/"; do
            for i in $(seq 1 20); do curl -fsS "$url" > /dev/null && break; sleep 6; done
            curl -fsS "$url" > /dev/null || { echo "Smoke test failed: $url"; exit 1; }
          done
