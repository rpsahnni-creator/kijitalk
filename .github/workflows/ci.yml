name: KijiTalk CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci || npm install
      # Typecheck needs the generated Prisma client types.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/kijitalk-test
          GEMINI_API_KEY: test-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      # `next lint` stops at an interactive ESLint setup prompt (no config in
      # the repo), so CI typechecks instead.
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4001
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:123:web:abc"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint

  auth-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kijitalk_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: auth-service
    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else
      AUTH_JWT_SECRET: ci-auth-jwt-secret-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kijitalk_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: auth-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps.accounts --noinput

  docker:
    # Proves every production image still builds (deploy.yml pushes them after merge).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [backend, auth-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    # Full stack in one runner: Postgres + auth-service + API + web, then Playwright.
    runs-on: ubuntu-latest
    needs: [backend, frontend, auth-service]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kijitalk_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kijitalk_e2e
      AUTH_JWT_SECRET: e2e-auth-jwt-secret-at-least-32-characters
      INTERNAL_API_KEY: e2e-internal-key-at-least-32-characters-long
      RAZORPAY_WEBHOOK_SECRET: e2e-webhook-secret
      RATE_LIMIT_PER_IP: 100000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: auth-service/requirements.txt }

      - name: Start auth-service
        working-directory: auth-service
        env:
          SECRET_KEY: e2e-secret-key
          DEBUG: 'True'
          THROTTLE_AUTH: 1000/min
          THROTTLE_EMAIL: 1000/hour
        run: |
          pip install -r requirements.txt
          python manage.py ensure_auth_schema && python manage.py migrate --noinput
          nohup python manage.py runserver 8100 > ../auth.log 2>&1 &

      - name: Start API
        working-directory: backend
        env:
          NODE_ENV: development
          GEMINI_API_KEY: e2e-placeholder
          SELLER_STATE: Karnataka
          CORS_ORIGIN: http://localhost:3100
        run: |
          npm ci && npx prisma generate && npx prisma migrate deploy
          nohup npx tsx src/index.ts > ../api.log 2>&1 &

      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci && npm run build
          nohup npx next start -p 3100 > ../web.log 2>&1 &

      - name: Wait for the stack
        run: |
          for url in http://localhost:8100/health/ http://localhost:4001/health http://localhost:3100/; do
            for i in $(seq 1 60); do curl -fsS "$url" > /dev/null && break; sleep 3; done
            curl -fsS "$url" > /dev/null || { echo "Not up: $url"; tail -50 *.log; exit 1; }
          done

      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - if: failure()
        run: tail -100 auth.log api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
